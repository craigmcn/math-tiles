name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn

      - run: yarn install --immutable

      - run: yarn format:check

      - run: yarn typecheck

      - run: yarn lint

      - run: yarn build

      - run: yarn test:coverage
